schemaVersion: 1

profiles:
  - name: gitlab
    scope:
      namespaces:
        - gitlab
    resources:
      deployment:
        names:
          - gitlab-webservice
          - gitlab-sidekiq
      statefulset:
        names:
          - gitaly
      configmap: {}
      job: {}
    # Applicable health monitoring is automatic. Changes are intentionally
    # explicit because routine deployments should not create alert noise.
    monitor:
      changes:
        events: [create, delete]
      # Drift means a qualifying live update from the previously observed
      # in-cluster state. It is not a comparison with a Git or Terraform source.
      drift:
        include: [image, replicas, resources, environment, configuration]
    context:
      diff: true
      kubernetesEvents: true
