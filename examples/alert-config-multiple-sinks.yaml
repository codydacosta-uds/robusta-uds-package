defaultSinks:
  - alerts-default

sinks:
  alerts-default:
    type: mattermost
    secretKey: alerts-default-url
  application-alerts:
    type: slack
    secretKey: application-alerts-url
  security-alerts:
    type: mattermost
    secretKey: security-alerts-url

alertProfiles:
  # Uses alerts-default because sinks is omitted.
  - name: zarf-namespaced-resources
    namespaces: [zarf]
    resources: [ConfigMap, Deployment, Service]

  # One resource policy shared by two exact namespaces and routed to Slack.
  - name: application-team-resources
    namespaces: [application-one, application-two]
    resources: [ConfigMap, Deployment, Ingress, Service, StatefulSet]
    sinks: [application-alerts]

  # Profiles can send the same alert to multiple platform-specific sinks.
  - name: payments-security-resources
    namespaces: [payments]
    resources: [Deployment, Ingress, Secret, ServiceAccount]
    sinks: [application-alerts, security-alerts]

clusterAlertProfiles:
  - name: cluster-scoped-resources
    resources: [ClusterRole, ClusterRoleBinding, Namespace, Node, PersistentVolume]
    sinks: [security-alerts]
