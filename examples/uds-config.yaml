# Example Robusta package variables to merge into an environment uds-config.
# The robusta-alert-webhooks Secret is managed separately.
variables:
  robusta:
    CLUSTER_NAME: "example-cluster"
    ALERT_ENVIRONMENT: "development"
    WATCH_SECRETS: "false"
    # ALERT_CONFIG must be a JSON string. Multi-line JSON keeps it readable in
    # uds-config.yaml. Sink names reference keys in the external Secret.
    ALERT_CONFIG: |-
      {
        "defaultSinks": ["alerts-default"],
        "sinks": {
          "alerts-default": {
            "type": "mattermost",
            "secretKey": "alerts-default-url"
          }
        },
        "namespacedAlertRules": [
          {
            "name": "application-resources",
            "enabled": true,
            "namespaces": ["application", "application-dev"],
            "resources": ["ConfigMap", "Deployment", "Ingress", "Service"]
          }
        ],
        "clusterAlertRules": [
          {
            "name": "cluster-scoped-resources",
            "enabled": true,
            "resources": ["ClusterRole", "ClusterRoleBinding", "Namespace", "Node", "PersistentVolume"]
          }
        ]
      }
