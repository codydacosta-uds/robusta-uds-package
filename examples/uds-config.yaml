# Merge these package variables into an environment uds-config.
# Webhook URLs remain in the external robusta-alert-webhooks Secret.
variables:
  robusta:
    CLUSTER_NAME: "example-cluster"
    ALERT_ENVIRONMENT: "development"
    WATCH_SECRETS: "false"
    PROFILE_CONFIG: |-
      schemaVersion: 1

      profiles:
        - name: gitlab
          scope:
            namespaces:
              - gitlab
          resources:
            deployment:
              names:
                - gitlab-webservice
                - gitlab-sidekiq
            statefulset:
              names:
                - gitaly
            configmap: {}
          monitor:
            changes:
              events:
                - create
                - delete
            drift:
              include:
                - image
                - replicas
                - resources
                - configuration
          context:
            diff: true
            kubernetesEvents: true
          notify:
            severity: high
