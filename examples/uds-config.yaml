# Example package variables to merge into an environment uds-config.
# Webhook URLs remain in the external robusta-alert-webhooks Secret.
variables:
  robusta:
    CLUSTER_NAME: "example-cluster"
    ALERT_ENVIRONMENT: "development"
    WATCH_SECRETS: "false"
    PROFILE_CONFIG: |-
      {
        "schemaVersion": 1,
        "defaultDestinations": ["alerts-default"],
        "destinations": {
          "alerts-default": {
            "type": "mattermost",
            "secretKey": "alerts-default-url"
          }
        },
        "profiles": [
          {
            "name": "application-production",
            "scope": {
              "namespaces": ["application"],
              "labels": {"app.kubernetes.io/part-of": "application"}
            },
            "resources": {
              "deployment": {"names": ["application-web", "application-worker"]},
              "statefulset": {"names": ["application-data"]},
              "configmap": {}
            },
            "monitor": {
              "changes": {"events": ["create", "delete"]},
              "drift": {"include": ["image", "replicas", "resources", "configuration"]}
            },
            "context": {"diff": true, "kubernetesEvents": true},
            "notify": {"severity": "high"}
          }
        ]
      }
