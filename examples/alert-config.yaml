# Named sinks map logical destinations to keys in Secret robusta-alert-webhooks.
defaultSinks:
  - alerts-default

sinks:
  alerts-default:
    type: mattermost # Change to slack for a Slack incoming webhook.
    secretKey: alerts-default-url

# Namespaced profiles use exact namespace names. Omitting sinks uses defaultSinks.
alertProfiles:
  - name: zarf-namespaced-resources
    enabled: true
    namespaces:
      - zarf
    resources:
      - ConfigMap
      - DaemonSet
      - Deployment
      - HorizontalPodAutoscaler
      - Ingress
      - Job
      - Pod
      - ReplicaSet
      - Service
      - ServiceAccount
      - StatefulSet

# Cluster-scoped profiles have no namespaces and produce red attachments.
clusterAlertProfiles:
  - name: cluster-scoped-resources
    enabled: true
    resources:
      - ClusterRole
      - ClusterRoleBinding
      - Namespace
      - Node
      - PersistentVolume
