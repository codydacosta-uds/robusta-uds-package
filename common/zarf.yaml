# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: robusta-common
  description: "UDS Robusta Common Package"

components:
  - name: robusta
    required: true
    charts:
      - name: uds-robusta-config
        namespace: robusta
        version: 0.1.0
        localPath: ../chart
        valuesFiles:
          - ../values/package-values.yaml
      - name: robusta
        namespace: robusta
        url: https://robusta-charts.storage.googleapis.com
        version: 0.48.0
        valuesFiles:
          - ../values/common-values.yaml
