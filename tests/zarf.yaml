# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: robusta-test
  description: "Test-only incoming webhook receiver for the Robusta package"
  version: "dev"

components:
  - name: webhook-test-mock
    required: true
    charts:
      - name: uds-robusta-webhook-mock
        namespace: robusta
        localPath: webhook-mock-chart
    images:
      - docker.io/library/python:3.13.2-alpine
