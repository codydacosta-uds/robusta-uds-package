apiVersion: v1
kind: ConfigMap
metadata:
  name: robusta-webhook-mock
  namespace: robusta
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from pathlib import Path

    PAYLOAD = Path("/data/payload.json")

    class Receiver(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0"))
            # Retain history so background cluster alerts cannot overwrite the
            # expected test finding before the polling assertion reads it.
            with PAYLOAD.open("ab") as payloads:
                payloads.write(self.rfile.read(length))
                payloads.write(b"\n")
            self.send_response(204)
            self.end_headers()

        def do_GET(self):
            if self.path != "/received" or not PAYLOAD.exists():
                self.send_response(404)
                self.end_headers()
                return
            body = PAYLOAD.read_bytes()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print(fmt % args, flush=True)

    HTTPServer(("0.0.0.0", 8080), Receiver).serve_forever()
---
apiVersion: v1
kind: Secret
metadata:
  name: robusta-alert-webhooks
  namespace: robusta
stringData:
  alerts-default-url: http://robusta-webhook-mock.robusta.svc.cluster.local:8080/
  alerts-slack-url: http://robusta-webhook-mock.robusta.svc.cluster.local:8080/
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robusta-webhook-mock
  namespace: robusta
  labels:
    app.kubernetes.io/name: robusta-webhook-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robusta-webhook-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robusta-webhook-mock
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mock
          image: python:3.13.2-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: script
          configMap:
            name: robusta-webhook-mock
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: robusta-webhook-mock
  namespace: robusta
spec:
  selector:
    app.kubernetes.io/name: robusta-webhook-mock
  ports:
    - name: http
      port: 8080
      targetPort: 8080
