# Exercise the documented multi-line uds-config input path in CI.
variables:
  robusta:
    CLUSTER_NAME: "robusta-test"
    ROBUSTA_ACCOUNT_ID: "test"
    ROBUSTA_SIGNING_KEY: "test-signing-key-no-credentials"
    ALERT_ENVIRONMENT: "test"
    WATCH_SECRETS: "false"
    ALERT_CONFIG: |-
      {
        "defaultSinks": ["alerts-default", "alerts-slack"],
        "sinks": {
          "alerts-default": {
            "type": "mattermost",
            "secretKey": "alerts-default-url"
          },
          "alerts-slack": {
            "type": "slack",
            "secretKey": "alerts-slack-url"
          }
        },
        "namespacedAlertRules": [
          {
            "name": "zarf-namespaced-resources",
            "enabled": true,
            "namespaces": ["zarf"],
            "resources": ["ConfigMap", "DaemonSet", "Deployment", "HorizontalPodAutoscaler", "Ingress", "Job", "Pod", "ReplicaSet", "Service", "ServiceAccount", "StatefulSet"]
          }
        ],
        "clusterAlertRules": [
          {
            "name": "cluster-scoped-resources",
            "enabled": true,
            "resources": ["ClusterRole", "ClusterRoleBinding", "Namespace", "Node", "PersistentVolume"]
          }
        ]
      }
