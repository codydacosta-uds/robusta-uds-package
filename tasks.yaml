# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/refs/heads/main/tasks.schema.json
includes:
  - test: ./tasks/test.yaml
  - create: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.2/tasks/create.yaml
  - lint: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.2/tasks/lint.yaml
  - setup: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.2/tasks/setup.yaml
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.2/tasks/actions.yaml
  - deploy: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.27.2/tasks/deploy.yaml

tasks:
  - name: create-dev-package
    description: Create the Robusta Zarf package
    actions:
      - task: create:package
        with:
          options: "--skip-sbom"

  - name: create-test-package
    description: Create the isolated Robusta test-support package
    actions:
      - cmd: cd tests && uds zarf package create . --architecture="${UDS_ARCH}" --skip-sbom --confirm

  - name: create-test-bundle
    description: Create the Robusta test bundle
    actions:
      - task: create:test-bundle

  - name: test-package
    description: Test the upstream Robusta package on a fresh UDS Core cluster
    actions:
      - task: create-dev-package
      - task: create-test-package
      - task: setup:k3d-test-cluster
        with:
          options: --set K3D_EXTRA_ARGS="-a=2"
          use_checkpoint: "false"
      - task: create-test-bundle
      - task: deploy:test-bundle
      - task: test:all

  # Entry point used by uds-common's callable-test workflow for type=install.
  - name: test-install
    description: Install and test the upstream Robusta package
    actions:
      - task: test-package

  - name: dev
    description: Build the upstream package, test support package, and test bundle
    actions:
      - task: create-dev-package
      - task: create-test-package
      - task: create-test-bundle
