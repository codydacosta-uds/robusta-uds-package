# Internal playbooks normalize native Kubernetes updates for the profile-aware
# relay. Users configure alert profiles and named sinks, not these playbooks.
x-relay-sink: &relay_sink [mattermost-relay]
x-change-filter: &change_filter
  ignore: [metadata.generation, metadata.resourceVersion, metadata.managedFields, status]

customPlaybooks:
  - name: ProfiledConfigMapChanges
    triggers:
      - on_configmap_update:
          change_filters: { <<: *change_filter, include: [data, binaryData] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "ConfigMap changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledDaemonSetChanges
    triggers:
      - on_daemonset_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "DaemonSet changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledDeploymentChanges
    triggers:
      - on_deployment_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "Deployment changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledHorizontalPodAutoscalerChanges
    triggers:
      - on_horizontalpodautoscaler_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "HorizontalPodAutoscaler changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledIngressChanges
    triggers:
      - on_ingress_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "Ingress changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledJobChanges
    triggers:
      - on_job_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "Job changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledPodChanges
    triggers:
      - on_pod_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "Pod changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledReplicaSetChanges
    triggers:
      - on_replicaset_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "ReplicaSet changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledSecretChanges
    triggers:
      - on_secret_update:
          # Kubewatch intentionally does not emit Secret data-value changes.
          change_filters: { <<: *change_filter, include: [metadata.labels, metadata.annotations, type] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "Secret changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledServiceChanges
    triggers:
      - on_service_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "Service changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledServiceAccountChanges
    triggers:
      - on_serviceaccount_update:
          change_filters: { <<: *change_filter, include: [automountServiceAccountToken, imagePullSecrets, metadata.labels, metadata.annotations] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "ServiceAccount changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledStatefulSetChanges
    triggers:
      - on_statefulset_update:
          change_filters: { <<: *change_filter, include: [spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "StatefulSet changed: $namespace/$name" }
    sinks: *relay_sink

  - name: ProfiledClusterRoleChanges
    triggers:
      - on_clusterrole_update:
          change_filters: { <<: *change_filter, include: [rules, metadata.labels, metadata.annotations] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "ClusterRole changed: cluster-scoped/$name" }
    sinks: *relay_sink

  - name: ProfiledClusterRoleBindingChanges
    triggers:
      - on_clusterrolebinding_update:
          change_filters: { <<: *change_filter, include: [roleRef, subjects, metadata.labels, metadata.annotations] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "ClusterRoleBinding changed: cluster-scoped/$name" }
    sinks: *relay_sink

  - name: ProfiledNamespaceChanges
    triggers:
      - on_namespace_update:
          change_filters: { <<: *change_filter, include: [metadata.labels, metadata.annotations] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "Namespace changed: cluster-scoped/$name" }
    sinks: *relay_sink

  - name: ProfiledNodeChanges
    triggers:
      - on_node_update:
          change_filters: { <<: *change_filter, include: [metadata.labels, metadata.annotations, spec] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "Node changed: cluster-scoped/$name" }
    sinks: *relay_sink

  - name: ProfiledPersistentVolumeChanges
    triggers:
      - on_persistentvolume_update:
          change_filters: { <<: *change_filter, include: [spec, metadata.labels, metadata.annotations] }
    actions:
      - resource_babysitter: {}
      - customise_finding: { severity: HIGH, title: "PersistentVolume changed: cluster-scoped/$name" }
    sinks: *relay_sink
