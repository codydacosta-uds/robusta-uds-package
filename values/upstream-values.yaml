# Base Robusta values. Copy and supply environment-specific values separately.
clusterName: ###ZARF_VAR_CLUSTER_NAME###
alertEnvironment: ###ZARF_VAR_ALERT_ENVIRONMENT###

globalConfig:
  account_id: ###ZARF_VAR_ROBUSTA_ACCOUNT_ID###
  signing_key: ###ZARF_VAR_ROBUSTA_SIGNING_KEY###

enablePrometheusStack: false
enableHolmesGPT: false

# Define one or more named sinks in an environment values file. URLs and
# credentials belong in deployment-time configuration, never this public base file.
sinksConfig:
  - webhook_sink:
      name: mattermost-relay
      url: http://robusta-mattermost-relay.robusta.svc.cluster.local/
      format: text
      size_limit: 12000

# Observe cluster-wide. Alerts occur only for explicit customPlaybooks supplied
# in a second values file.
kubewatch:
  config:
    namespace: ""
    resource:
      # Native types jointly supported by current Kubewatch and Robusta.
      clusterrole: true
      clusterrolebinding: true
      configmap: true
      daemonset: true
      deployment: true
      # Event updates reach the runner but do not produce change findings in 0.48.0.
      event: false
      hpa: true
      ingress: true
      job: true
      namespace: true
      node: true
      persistentvolume: true
      pod: true
      replicaset: true
      serviceaccount: true
      services: true
      statefulset: true
      # Opt-in only. The relay always redacts Secret values before external delivery.
      secret: ###ZARF_VAR_WATCH_SECRETS###

# CRD permissions are intentionally explicit. Enable only the CRD families used.
runner:
  crdPermissions:
    argo: false
    flux: false
    keda: false
    crossplane: false
    istio: false
    gatewayApi: false
    velero: false
    externalSecrets: false


