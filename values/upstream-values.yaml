# Base Robusta 0.48.0 values. Profile users do not configure this file.
clusterName: ###ZARF_VAR_CLUSTER_NAME###
alertEnvironment: ###ZARF_VAR_ALERT_ENVIRONMENT###

globalConfig:
  account_id: ###ZARF_VAR_ROBUSTA_ACCOUNT_ID###
  signing_key: ###ZARF_VAR_ROBUSTA_SIGNING_KEY###

enablePrometheusStack: false
enableHolmesGPT: false
enablePlatformPlaybooks: false

# Profiles generate every active Kubernetes playbook. Disable upstream
# unscoped defaults so health findings cannot bypass Profile scope or collect
# logs/Prometheus graphs unexpectedly.
priorityBuiltinPlaybooks: []
builtinPlaybooks: []
customPlaybooks: []
playbookRepos:
  uds_profile_actions:
    url: file:///opt/uds-profile-actions
    pip_install: false

# Robusta 0.48.0 cannot JSON-serialize KubernetesDiffBlock reliably. Changes
# therefore use its native text transport; health findings use native JSON.
sinksConfig:
  - webhook_sink:
      name: profile-change-relay
      url: http://robusta-alert-relay.robusta.svc.cluster.local/change
      format: text
      size_limit: 12000
  - webhook_sink:
      name: profile-health-relay
      url: http://robusta-alert-relay.robusta.svc.cluster.local/health
      format: json
      size_limit: 12000

# Kubewatch observes supported native resources cluster-wide. Generated Robusta
# scopes decide which events become findings. Secret observation remains an
# explicit package-level security gate.
kubewatch:
  config:
    namespace: ""
    resource:
      clusterrole: true
      clusterrolebinding: true
      configmap: true
      daemonset: true
      deployment: true
      event: false
      hpa: true
      ingress: true
      job: true
      namespace: true
      node: true
      persistentvolume: true
      pod: true
      replicaset: true
      secret: ###ZARF_VAR_WATCH_SECRETS###
      serviceaccount: true
      services: true
      statefulset: true

runner:
  annotations:
    uds.dev/alert-config-version: profiles-v3
  # Robusta loads this package-managed action before activating generated
  # Profile health playbooks. It resolves Pod controller ownership and fails
  # closed when ownership cannot be verified.
  extraVolumes:
    - name: profile-actions
      configMap:
        name: robusta-profile-actions
        items:
          - key: __init__.py
            path: uds_profile_actions/__init__.py
          - key: ownership.py
            path: uds_profile_actions/ownership.py
  extraVolumeMounts:
    - name: profile-actions
      mountPath: /opt/uds-profile-actions
      readOnly: true
  additional_env_vars:
    - name: PYTHONPATH
      value: /opt/uds-profile-actions
    - name: ENABLE_TELEMETRY
      value: "false"
  crdPermissions:
    argo: false
    flux: false
    keda: false
    crossplane: false
    istio: false
    gatewayApi: false
    velero: false
    externalSecrets: false
