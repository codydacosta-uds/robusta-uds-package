# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: robusta
  description: "UDS Robusta package"
  version: "dev"
  annotations:
    dev.uds.title: Robusta
    dev.uds.tagline: Kubernetes monitoring, troubleshooting, and alerting
    dev.uds.categories: Monitoring, Observability, DevOps
    dev.uds.keywords: Kubernetes, Monitoring, Alerting, Troubleshooting, Observability
    dev.uds.icon: https://github.com/robusta-dev.png

variables:
  - name: DOMAIN
    default: "uds.dev"
  - name: CLUSTER_NAME
    default: "robusta-cluster"
  - name: ROBUSTA_ACCOUNT_ID
    default: ""
  - name: ROBUSTA_SIGNING_KEY
    default: ""
  - name: ALERT_ENVIRONMENT
    default: "production"
  # Pass JSON as compact CLI input or a multi-line uds-config string.
  # See docs/configuration.md for both forms.
  - name: ALERT_CONFIG
    default: '{"defaultSinks":["mattermost-default"],"sinks":{"mattermost-default":{"secretKey":"url"}},"alertProfiles":[{"name":"zarf-namespaced-resources","enabled":true,"namespaces":["zarf"],"resources":["ConfigMap","DaemonSet","Deployment","HorizontalPodAutoscaler","Ingress","Job","Pod","ReplicaSet","Service","ServiceAccount","StatefulSet"]}],"clusterAlertProfiles":[{"name":"cluster-scoped-resources","enabled":true,"resources":["ClusterRole","ClusterRoleBinding","Namespace","Node","PersistentVolume"]}]}'
  - name: WATCH_SECRETS
    description: Enable opt-in Kubewatch observation for Secret updates
    default: "false"

components:
  - name: robusta
    required: true
    description: "Deploy Robusta"
    import:
      path: common
    only:
      flavor: upstream
    charts:
      - name: robusta
        valuesFiles:
          - values/upstream-values.yaml
    images:
      - docker.io/robustadev/robusta-runner:0.48.0
      - docker.io/robustadev/kubewatch:v2.16.1
      - docker.io/library/python:3.13.2-alpine
