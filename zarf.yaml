# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: robusta
  description: "UDS Robusta package"
  version: "dev"
  annotations:
    dev.uds.title: Robusta
    dev.uds.tagline: Kubernetes monitoring, troubleshooting, and alerting
    dev.uds.categories: Monitoring, Observability, DevOps
    dev.uds.keywords: Kubernetes, Monitoring, Alerting, Troubleshooting, Observability
    dev.uds.icon: https://github.com/robusta-dev.png

variables:
  - name: DOMAIN
    default: "uds.dev"
  - name: CLUSTER_NAME
    default: "robusta-cluster"
  - name: ROBUSTA_ACCOUNT_ID
    default: ""
  - name: ROBUSTA_SIGNING_KEY
    default: ""
  - name: ALERT_ENVIRONMENT
    default: "production"
  # Empty uses the package's low-noise UDS Core workload-health Profile.
  - name: PROFILE_CONFIG
    default: ""
  # Internal upgrade input; new deployments configure PROFILE_CONFIG.
  - name: ALERT_CONFIG
    default: ""
  - name: WATCH_SECRETS
    description: Enable opt-in Kubewatch observation for Secret updates
    default: "false"

components:
  - name: robusta
    required: true
    description: "Deploy Robusta"
    import:
      path: common
    only:
      flavor: upstream
    charts:
      - name: robusta
        valuesFiles:
          - values/upstream-values.yaml
      # Runs after the upstream chart so its verified output can update the
      # exact Robusta configuration Secret and trigger Robusta's file reload.
      - name: robusta-profile-compiler
        namespace: robusta
        version: 0.1.0
        localPath: profile-compiler-chart
    images:
      - docker.io/robustadev/robusta-runner:0.48.0
      - docker.io/robustadev/kubewatch:v2.16.1
      - docker.io/library/python:3.13.2-alpine
