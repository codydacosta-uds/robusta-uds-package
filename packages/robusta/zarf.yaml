# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: robusta
  description: "UDS Robusta package"
  version: "dev"
  annotations:
    dev.uds.title: Robusta
    dev.uds.tagline: Kubernetes monitoring, troubleshooting, and alerting
    dev.uds.categories: Monitoring, Observability, DevOps
    dev.uds.keywords: Kubernetes, Monitoring, Alerting, Troubleshooting, Observability
    dev.uds.icon: https://github.com/robusta-dev.png

variables:
  - name: DOMAIN
    default: "uds.dev"

components:
  - name: robusta
    required: true
    description: "Deploy Robusta"
    import:
      path: common
    only:
      flavor: upstream
    charts:
      - name: robusta
        valuesFiles:
          - values/upstream-values.yaml
    images:
      - docker.io/robustadev/robusta-runner:0.48.0
      - docker.io/robustadev/kubewatch:v2.16.1
      - docker.io/library/python:3.13.2-alpine

  - name: mattermost-test-mock
    required: true
    description: "Test-only Mattermost webhook receiver"
    only:
      flavor: test
    charts:
      - name: uds-robusta-test-mock
        namespace: robusta
        localPath: test-mock-chart
    images:
      - docker.io/library/python:3.13.2-alpine

  - name: robusta
    required: true
    description: "Deploy Robusta with the Mattermost test receiver"
    import:
      path: common
    only:
      flavor: test
    charts:
      - name: robusta
        valuesFiles:
          - values/test-values.yaml
    images:
      - docker.io/robustadev/robusta-runner:0.48.0
      - docker.io/robustadev/kubewatch:v2.16.1
      - docker.io/library/python:3.13.2-alpine
