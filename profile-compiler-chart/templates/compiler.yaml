apiVersion: v1
kind: ServiceAccount
metadata:
  name: robusta-profile-compiler
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: robusta-profile-compiler
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["robusta-playbooks-config-secret"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["robusta-runner"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: robusta-profile-compiler
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: robusta-profile-compiler
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: robusta-profile-compiler
---
apiVersion: batch/v1
kind: Job
metadata:
  name: robusta-profile-compiler
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robusta-profile-compiler
    spec:
      serviceAccountName: robusta-profile-compiler
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compiler
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["python", "/profile/profile_compiler.py"]
          env:
            - name: PYTHONPATH
              value: /profile:/app/src:/app/playbooks
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROFILE_CONFIG_PATH
              value: /profile/profiles.json
            - name: ROBUSTA_CONFIG_SECRET
              value: robusta-playbooks-config-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: compiler
              mountPath: /profile
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: compiler
          configMap:
            name: robusta-alert-relay
        - name: tmp
          emptyDir: {}
