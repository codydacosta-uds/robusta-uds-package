# Support for custom `network.allow` entries on the Package CR
# https://docs.defenseunicorns.com/core/how-to-guides/networking/define-network-access/
additionalNetworkAllow: []

alertEnvironment: production
watchSecrets: false

# JSON is used so the complete profile collection can be supplied through the
# Zarf ALERT_CONFIG variable without requiring users to write Robusta playbooks.
alertConfig: >-
  {"defaultSinks":["mattermost-default"],"sinks":{"mattermost-default":{"secretKey":"url"}},"alertProfiles":[{"name":"zarf-namespaced-resources","enabled":true,"namespaces":["zarf"],"resources":["ConfigMap","DaemonSet","Deployment","HorizontalPodAutoscaler","Ingress","Job","Pod","ReplicaSet","Service","ServiceAccount","StatefulSet"]}],"clusterAlertProfiles":[{"name":"cluster-scoped-resources","enabled":true,"resources":["ClusterRole","ClusterRoleBinding","Namespace","Node","PersistentVolume"]}]}
