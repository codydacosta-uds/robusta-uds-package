# Support for custom `network.allow` entries on the Package CR
# https://docs.defenseunicorns.com/core/how-to-guides/networking/define-network-access/
additionalNetworkAllow: []

alertEnvironment: production
watchSecrets: false

# User Profile JSON. Empty uses the low-noise UDS Core health Profile below.
profileConfig: ""

# Accepted internally so existing deployments can be upgraded without changing
# their package variables. New deployments use Profiles.
alertConfig: ""

defaultProfileConfig: >-
  {"schemaVersion":1,"defaultDestinations":["alerts-default"],"destinations":{"alerts-default":{"type":"mattermost","secretKey":"alerts-default-url"}},"profiles":[{"name":"uds-core-health","scope":{"namespaces":["zarf"]},"resources":{"daemonset":{},"deployment":{},"job":{},"replicaset":{},"statefulset":{}},"notify":{"severity":"high"}}]}
