apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: robusta
  namespace: {{ .Release.Namespace }}
# Full Package CR spec reference:
# https://docs.defenseunicorns.com/core/reference/operator--crds/packages-v1alpha1-cr/
spec:
  # Robusta is an alerting backend; it has no user-facing HTTP service.
  network:
    serviceMesh:
      mode: ambient
    allow:
      - direction: Ingress
        remoteGenerated: IntraNamespace

      - direction: Egress
        remoteGenerated: IntraNamespace

      # Robusta runner and forwarder use the Kubernetes API.
      - direction: Egress
        remoteGenerated: KubeAPI
        selector:
          app: robusta-runner
        description: "Robusta runner Kubernetes API access"
      - direction: Egress
        remoteGenerated: KubeAPI
        selector:
          app: robusta-forwarder
        description: "Robusta forwarder Kubernetes API access"

      # The alert relay delivers to supported external webhook destinations.
      - direction: Egress
        remoteGenerated: Anywhere
        selector:
          app.kubernetes.io/name: robusta-alert-relay
        port: 443
        description: "External alert webhook delivery"

      # Custom rules for unanticipated scenarios
      {{- with .Values.additionalNetworkAllow }}
      {{ toYaml . | nindent 6 }}
      {{- end }}
