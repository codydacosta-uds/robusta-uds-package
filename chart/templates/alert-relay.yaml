apiVersion: v1
kind: ConfigMap
metadata:
  name: robusta-alert-relay
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: robusta-alert-relay
data:
  relay.py: |
{{ .Files.Get "files/relay.py" | indent 4 }}
  rules.json: {{ .Values.alertConfig | quote }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robusta-alert-relay
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: robusta-alert-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robusta-alert-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robusta-alert-relay
      annotations:
        checksum/relay-config: {{ printf "%s\n%s" (.Files.Get "files/relay.py") .Values.alertConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: relay
          image: python:3.13.2-alpine
          command: ["python", "/app/relay.py"]
          env:
            - name: ALERT_ENVIRONMENT
              value: {{ .Values.alertEnvironment | quote }}
            - name: ALERT_CONFIG_PATH
              value: /app/rules.json
            - name: SINK_DIRECTORY
              value: /etc/robusta-alert-webhooks
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: webhooks
              mountPath: /etc/robusta-alert-webhooks
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: robusta-alert-relay
        - name: webhooks
          secret:
            secretName: robusta-alert-webhooks
---
apiVersion: v1
kind: Service
metadata:
  name: robusta-alert-relay
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: robusta-alert-relay
  ports:
    - port: 80
      targetPort: 8080
